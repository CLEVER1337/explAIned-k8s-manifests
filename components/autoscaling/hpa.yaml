apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ranking-service
  labels:
    app.kubernetes.io/name: ranking-service
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ranking-service
  minReplicas: 2
  # Scales freely — a LightGBM booster is a few megabytes, so a second copy costs nothing.
  # Unlike faiss-service, where every replica is another full copy of the index.
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

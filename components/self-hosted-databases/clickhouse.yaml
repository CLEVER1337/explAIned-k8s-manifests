# ClickHouse holds everything analytical: `explained.user_events` (written by the Kafka sink)
# and `explained.feed_impressions` (written by :5056). Nothing on the request path reads it —
# the offline jobs do, hourly at most — so a single node with one volume is the right size.
#
# The database name is lowercase. ClickHouse identifiers are case-sensitive and every consumer
# in the repo says `explained`; `explAIned` silently swallows inserts.
#
# The tables are not created here — base/infra/clickhouse-schema.yaml owns that, because they
# are needed wherever ClickHouse runs, VM included. This server is deliberately left with its
# stock `default` account: no password, reachable from anywhere, which is fine for a laptop
# cluster and is nothing like how the homelab's ClickHouse is configured.
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/component: analytics
spec:
  selector:
    app.kubernetes.io/name: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: http
    - name: native
      port: 9000
      targetPort: native
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/component: analytics
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
        app.kubernetes.io/component: analytics
    spec:
      securityContext:
        fsGroup: 101
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:25.3-alpine
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          env:
            # Both writers connect as `default` with no password (see the ClickHouse
            # connection strings in the consumer and in explAIned-ml's config). Giving this a
            # password means changing it in three places at once, so the prod overlay does it
            # deliberately rather than the base doing it halfway.
            - name: CLICKHOUSE_USER
              value: default
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi

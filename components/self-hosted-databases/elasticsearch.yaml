# Elasticsearch is a read-only search index here, not a store of record: PostgreSQL is the
# source of truth and ES is rebuilt from it by ElasticsearchIndexerHostedService off the
# `articles.events` topic. Losing this volume costs a reindex, not data — which is why it gets
# one replica and no fuss.
#
# Server major must track the client. explAInedArticleService pins
# Elastic.Clients.Elasticsearch 9.3.x, so this is 9.x; a 8.x server answers with a product
# check the 9.x client rejects.
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/component: search
spec:
  selector:
    app.kubernetes.io/name: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/component: search
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/component: search
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        # ES refuses to start if vm.max_map_count is below 262144, and that sysctl is per-node
        # and not namespaced — so it cannot be set from the pod spec's securityContext.
        # If your cluster runs Pod Security Admission at `restricted`, or your nodes already
        # ship the right value (most managed clusters do), delete this container: the prod
        # overlay shows the patch.
        - name: raise-max-map-count
          image: busybox:1.36
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]
          securityContext:
            privileged: true
            runAsUser: 0
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300
          env:
            - name: discovery.type
              value: single-node
            # Security on, TLS off. The username/password pair the article service sends is
            # still checked; the certificate it used to skip validating no longer exists,
            # because inside the cluster this is plain HTTP on the pod network.
            - name: xpack.security.enabled
              value: "true"
            - name: xpack.security.http.ssl.enabled
              value: "false"
            - name: xpack.security.transport.ssl.enabled
              value: "false"
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: explained-elasticsearch
                  key: ELASTIC_PASSWORD
            # Keep the heap at half the memory limit below and leave the rest to Lucene's
            # off-heap file cache. Raising the limit without raising this wastes the extra.
            - name: ES_JAVA_OPTS
              value: -Xms1g -Xmx1g
            - name: bootstrap.memory_lock
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
          readinessProbe:
            # exec + curl rather than httpGet: an httpGet probe cannot read a Secret, so it
            # would need the Basic header spelled out in the manifest. This way the credential
            # stays in one place and the probe still asserts the cluster is actually yellow,
            # not merely listening.
            exec:
              command:
                - sh
                - -c
                - >-
                  curl -sf -u "elastic:$ELASTIC_PASSWORD"
                  'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=1s'
                  >/dev/null
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 1536Mi
            limits:
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

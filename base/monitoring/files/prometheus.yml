# DNS service discovery against the headless Services in services/metrics-endpoints.yaml.
#
# Not pod service discovery, which is the usual answer: that needs a ServiceAccount and a Role
# to list pods with, and the k3s homelab's deploy account is namespace-scoped and cannot
# create either. DNS needs no API access, resolves through the pod's own resolv.conf, and
# produces the same target list. One config that works on kind and on k3s beats two that
# each work in one place.
#
# The `service` label is set per job rather than relabelled off a pod label, and it is the
# compatibility bridge: every panel in microservices.json and every alert in
# recommendations.yml selects on service="article", service="faiss" and so on, so both carry
# over from the docker-compose setup untouched.
#
# Names are short, so they resolve through the search domain of whatever namespace this runs
# in. Nothing here has to change to stand a second copy of the stack up next door.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: identity
    dns_sd_configs:
      - names: ['identity-service-metrics']
        type: A
        port: 5125
    relabel_configs:
      - target_label: service
        replacement: identity

  - job_name: article
    dns_sd_configs:
      - names: ['article-service-metrics']
        type: A
        port: 5036
    relabel_configs:
      - target_label: service
        replacement: article

  - job_name: comment
    dns_sd_configs:
      - names: ['comment-service-metrics']
        type: A
        port: 5046
    relabel_configs:
      - target_label: service
        replacement: comment

  - job_name: profile
    dns_sd_configs:
      - names: ['profile-service-metrics']
        type: A
        port: 5066
    relabel_configs:
      - target_label: service
        replacement: profile

  - job_name: recommendation
    dns_sd_configs:
      - names: ['recommendation-service-metrics']
        type: A
        port: 5056
    relabel_configs:
      - target_label: service
        replacement: recommendation

  - job_name: faiss
    dns_sd_configs:
      - names: ['faiss-service-metrics']
        type: A
        port: 8001
    relabel_configs:
      - target_label: service
        replacement: faiss

  - job_name: ranking
    dns_sd_configs:
      - names: ['ranking-service-metrics']
        type: A
        port: 8002
    relabel_configs:
      - target_label: service
        replacement: ranking

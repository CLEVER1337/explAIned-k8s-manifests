# Path-based routing with no rewriting anywhere, which is only possible because the services
# already own disjoint top-level paths: /user and /session belong to identity, /articles to
# article, /comments to comment, /profiles to profile, /api/feed to recommendation. Nothing
# collides, so every request reaches its service with the path the service already expects and
# there is no rewrite-target annotation to get subtly wrong.
#
# Not exposed here, on purpose:
#   faiss-service, ranking-service   internal to the recommendation loop; the feed calls them,
#                                    the outside world has no business doing so
#   event-consumer-service           a Kafka consumer with an incidental HTTP surface
#   prometheus                       kubectl port-forward svc/prometheus 9090:9090
#
# The hostnames are dev placeholders. The prod overlay replaces them and adds TLS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: explained-api
  labels:
    app.kubernetes.io/name: explained-api
    app.kubernetes.io/component: ingress
  annotations:
    # Avatar:MaxBytes is 1 MiB and nginx-ingress defaults to a 1m body limit — a multipart
    # upload of a file at the limit is a few hundred bytes larger than the file itself and
    # would be rejected by the proxy before the service ever applied its own check.
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    # The feed's own budget is 300 ms; anything past a few seconds is a dead upstream, not a
    # slow one.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  ingressClassName: nginx
  rules:
    - host: api.explained.local
      http:
        paths:
          - path: /user
            pathType: Prefix
            backend:
              service:
                name: identity-service
                port:
                  number: 5125
          - path: /session
            pathType: Prefix
            backend:
              service:
                name: identity-service
                port:
                  number: 5125
          - path: /articles
            pathType: Prefix
            backend:
              service:
                name: article-service
                port:
                  number: 5036
          - path: /comments
            pathType: Prefix
            backend:
              service:
                name: comment-service
                port:
                  number: 5046
          - path: /profiles
            pathType: Prefix
            backend:
              service:
                name: profile-service
                port:
                  number: 5066
          - path: /api/feed
            pathType: Prefix
            backend:
              service:
                name: recommendation-service
                port:
                  number: 5056
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: explained-grafana
  labels:
    app.kubernetes.io/name: explained-grafana
    app.kubernetes.io/component: ingress
spec:
  ingressClassName: nginx
  rules:
    # Its own host rather than a /grafana path: serving Grafana from a subpath needs
    # GF_SERVER_SERVE_FROM_SUB_PATH plus a matching root_url, and getting that pair half-right
    # produces a UI that loads and then breaks on the first redirect.
    - host: grafana.explained.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000

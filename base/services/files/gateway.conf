# The path map that used to be an Ingress.
#
# There is no ingress controller to hand: the k3s cluster disables Traefik (ports 80 and 443
# on the hypervisor are already DNAT'd to the Caddy on the Forgejo VM, so an in-cluster
# controller could not claim them anyway), and Caddy proxies one hostname to one NodePort.
# explAIned needs five backends behind one origin, so the routing has to happen on this side.
#
# Every location proxies without rewriting, because the services already own disjoint
# top-level paths — /user and /session are identity's, /articles is the article service's, and
# so on. Nothing collides, so each request reaches its backend with the path it already
# expects and there is no rewrite rule to get subtly wrong.
#
# proxy_pass targets are Service names, resolved once when nginx starts. That is safe here in
# a way it would not be for pod IPs: a ClusterIP is stable for the lifetime of the Service, so
# pods churning behind it changes nothing. Deleting and recreating a Service does change it —
# restart this Deployment if you ever do.

upstream identity   { server identity-service:5125;       keepalive 8; }
upstream articles   { server article-service:5036;        keepalive 8; }
upstream comments   { server comment-service:5046;        keepalive 8; }
upstream profiles   { server profile-service:5066;        keepalive 8; }
upstream feed       { server recommendation-service:5056; keepalive 8; }

server {
    # 8080, not 80: the unprivileged nginx image runs as uid 101 and cannot bind a low port.
    listen 8080;
    server_name _;

    # Avatar:MaxBytes is 1 MiB, and a multipart upload of a file at that limit is a few
    # hundred bytes larger than the file itself. nginx's 1m default would reject it here,
    # before the service ever applied its own check.
    client_max_body_size 2m;

    # What Caddy's `health_uri` polls. Answered by nginx itself on purpose — it says this
    # gateway is up, not that any backend is, which is exactly the question Caddy is asking
    # when it decides whether to keep sending this node its share of the traffic.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /user     { proxy_pass http://identity; }
    location /session  { proxy_pass http://identity; }
    location /articles { proxy_pass http://articles; }
    location /comments { proxy_pass http://comments; }
    location /profiles { proxy_pass http://profiles; }
    location /api/feed { proxy_pass http://feed; }

    # Not routed, deliberately: faiss-service and ranking-service are internal to the
    # recommendation loop, event-consumer-service is a Kafka consumer with an incidental HTTP
    # surface, and Prometheus is reached with `kubectl port-forward`.
    location / { return 404; }

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The feed's own budget is 300 ms. Anything past a few seconds is a dead upstream, not a
    # slow one, and holding the connection open only ties up a worker.
    proxy_connect_timeout 3s;
    proxy_read_timeout   30s;
}

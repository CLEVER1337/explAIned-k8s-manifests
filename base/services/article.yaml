# The article service is not just an API. The same process runs both background workers:
#
#   OutboxPublisherHostedService      polls OutboxEvents, publishes to articles.events
#   ElasticsearchIndexerHostedService consumes articles.events, indexes into ES
#
# So a replica is an API replica *and* a member of the `article-service-indexer` consumer
# group. That is intended (the Dockerfile says so), and it is why the HPA below stops at 3:
# articles.events has 3 partitions, and a fourth consumer would sit idle holding no assignment
# while still polling the outbox.
#
# The outbox publisher is a different story — every replica polls the same
# `WHERE PublishedAt IS NULL` set. It is safe (publishing twice is at-least-once, which the
# indexer already tolerates) but it is duplicated work that grows with replica count. Splitting
# the publisher into its own single-replica Deployment is the clean fix; it needs a code change
# to make the hosted services individually switchable, so it is not done here.
apiVersion: v1
kind: Service
metadata:
  name: article-service
  labels:
    app.kubernetes.io/name: article-service
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: article-service
  ports:
    - name: http
      port: 5036
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: article-service
  labels:
    app.kubernetes.io/name: article-service
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: article-service
  strategy:
    rollingUpdate:
      # One at a time. A rollout is a consumer-group rebalance; going two-at-a-time doubles the
      # window where nobody holds a partition and the indexer lag climbs.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: article-service
        app.kubernetes.io/component: api
        explained.io/service: article
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5036"
        prometheus.io/path: /metrics
    spec:
      # Kafka's default session timeout gives a departing consumer ~45s before the group
      # notices. Long enough here that an in-flight ES index call finishes and commits its
      # offset instead of being replayed by whoever picks the partition up.
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER"; do sleep 2; done
          envFrom:
            - configMapRef:
                name: explained-endpoints
      containers:
        - name: article-service
          image: explained/article-service
          ports:
            - name: http
              containerPort: 5036
          envFrom:
            - configMapRef:
                name: explained-endpoints
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: explained-postgres
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: explained-redis
                  key: REDIS_PASSWORD
            - name: ConnectionStrings__PostgreSQL
              value: Host=$(POSTGRES_HOST);Port=$(POSTGRES_PORT);Database=articles;Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)
            - name: ConnectionStrings__Redis
              value: $(REDIS_HOST):$(REDIS_PORT),password=$(REDIS_PASSWORD),abortConnect=false
            - name: Database__Provider
              value: Postgres
            - name: Cache__Provider
              value: Redis
            - name: Elasticsearch__Url
              value: $(ELASTICSEARCH_URL)
            - name: Elasticsearch__Username
              value: $(ELASTICSEARCH_USERNAME)
            - name: Elasticsearch__Password
              valueFrom:
                secretKeyRef:
                  name: explained-elasticsearch
                  key: ELASTIC_PASSWORD
            - name: Kafka__BootstrapServers
              value: $(KAFKA_BOOTSTRAP_SERVERS)
            - name: Kafka__Topic
              value: $(KAFKA_ARTICLES_TOPIC)
            - name: Kafka__UserEventsTopic
              value: $(KAFKA_USER_EVENTS_TOPIC)
            # Shared across replicas on purpose — this is what makes them one consumer group
            # and gives each a disjoint slice of the partitions.
            - name: Kafka__ConsumerGroupId
              value: article-service-indexer
            - name: Kafka__PublisherPollMs
              value: "1000"
            - name: Kafka__PublisherBatchSize
              value: "100"
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: explained-jwt
                  key: JWT_KEY
            - name: Jwt__Issuer
              value: $(JWT_ISSUER)
            - name: Jwt__Audience
              value: $(JWT_AUDIENCE)
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: article-service
  labels:
    app.kubernetes.io/name: article-service
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: article-service
  minReplicas: 2
  # Hard ceiling at the partition count of articles.events. Raising this without also raising
  # `--partitions` on the topic buys nothing: the extra replicas serve HTTP but join the
  # indexer group with no assignment.
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Slow on the way down: each removal is a rebalance, and thrashing the group is worse
      # than carrying a spare pod for five minutes.
      stabilizationWindowSeconds: 300

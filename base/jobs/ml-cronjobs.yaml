apiVersion: batch/v1
kind: CronJob
metadata:
  name: ml-train-als
  labels:
    app.kubernetes.io/name: ml-train-als
    app.kubernetes.io/component: job
spec:
  # Daily, well inside the 48-hour TTL on rec:user_als_candidates:*.
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ml-train-als
            app.kubernetes.io/component: job
        spec:
          restartPolicy: Never
          containers:
            - name: train-als
              image: explained/ml-jobs
              command:
                - /bin/sh
                - -c
                - 'python -m explained_ml.jobs.train_als; c=$?; [ $c -eq 1 ] && exit 0; exit $c'
              envFrom:
                - configMapRef:
                    name: explained-endpoints
              env:
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: explained-redis
                      key: REDIS_PASSWORD
                - name: REDIS_URL
                  value: redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/0
                - name: CLICKHOUSE_URL
                  value: $(CLICKHOUSE_URL)
                - name: CLICKHOUSE_DATABASE
                  value: $(CLICKHOUSE_DATABASE)
                # implicit spawns a thread per core by default and thrashes under a CPU limit.
                # Pinning it to the request keeps the factorisation predictable.
                - name: OPENBLAS_NUM_THREADS
                  value: "2"
              resources:
                requests:
                  cpu: "2"
                  memory: 2Gi
                limits:
                  memory: 4Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ml-train-lightgbm
  labels:
    app.kubernetes.io/name: ml-train-lightgbm
    app.kubernetes.io/component: job
spec:
  # An hour after train_als and well after build_features: this trains on what they produced.
  schedule: "30 4 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ml-train-lightgbm
            app.kubernetes.io/component: job
        spec:
          restartPolicy: Never
          containers:
            - name: train-lightgbm
              image: explained/ml-jobs
              command:
                - /bin/sh
                - -c
                - 'python -m explained_ml.jobs.train_lightgbm; c=$?; [ $c -eq 1 ] && exit 0; exit $c'
              envFrom:
                - configMapRef:
                    name: explained-endpoints
              env:
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: explained-redis
                      key: REDIS_PASSWORD
                - name: REDIS_URL
                  value: redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/0
                - name: CLICKHOUSE_URL
                  value: $(CLICKHOUSE_URL)
                - name: CLICKHOUSE_DATABASE
                  value: $(CLICKHOUSE_DATABASE)
                # The one job that shares state with a running service: it writes the tracking
                # DB and the artifacts that :8002 resolves `champion` out of. Same URIs as the
                # ranking service, same volume — if these two disagree the model trains into a
                # registry nobody reads.
                - name: MLFLOW_TRACKING_URI
                  value: sqlite:////app/mlruns/mlflow.db
                - name: MLFLOW_REGISTRY_URI
                  value: sqlite:////app/mlruns/mlflow.db
                - name: MLFLOW_ARTIFACT_ROOT
                  value: /app/mlruns/artifacts
                - name: MLFLOW_EXPERIMENT
                  value: explained-ranking
                - name: MLFLOW_MODEL_NAME
                  value: explained-ranker
                - name: MLFLOW_MODEL_ALIAS
                  value: champion
              volumeMounts:
                - name: mlflow
                  mountPath: /app/mlruns
              resources:
                requests:
                  cpu: "2"
                  memory: 2Gi
                limits:
                  memory: 4Gi
          volumes:
            - name: mlflow
              persistentVolumeClaim:
                claimName: mlflow-store

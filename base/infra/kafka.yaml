# Single-broker KRaft — no ZooKeeper, matching the 4.x distribution the repo already vendors.
#
# Two topics, two purposes, and they must not be conflated:
#   articles.events  outbox / entity sync. Transactional, consumed by
#                    ElasticsearchIndexerHostedService with EnableAutoCommit=false.
#   user.events      analytics. Direct produce, at-most-once, failures swallowed.
#
# Both get 3 partitions, which is also the ceiling on useful replicas for anything that
# consumes them — see the note on the article service HPA.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: broker
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: broker
    - name: controller
      port: 9093
      targetPort: controller
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: broker
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: broker
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: apache/kafka:4.1.0
          ports:
            - name: broker
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Fixed, not generated: the entrypoint formats the log directory with this id on
            # first boot and refuses to start against a volume formatted with a different one.
            # Generating it per-rollout would brick the broker on its second restart.
            - name: CLUSTER_ID
              value: explained-kraft-cluster-0
            - name: KAFKA_NODE_ID
              value: "0"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            # What a client is told to reconnect to after bootstrapping. It has to resolve from
            # inside the cluster, hence the FQDN; $(POD_NAMESPACE) keeps it correct if this
            # stack is deployed into a namespace other than `explained`.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka-0.kafka.$(POD_NAMESPACE).svc.cluster.local:9092
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 0@kafka-0.kafka.$(POD_NAMESPACE).svc.cluster.local:9093
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # Off on purpose. A typo in Kafka:Topic should fail loudly, not quietly create
            # `article.events` with one partition and strand the indexer on an empty topic.
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka
          readinessProbe:
            tcpSocket:
              port: broker
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: broker
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1536Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
# Creates both topics once the broker answers. `--if-not-exists` plus a bounded wait makes the
# whole thing safe to re-run, which matters because kustomize has no post-install hook: this
# Job is applied at the same time as everything else and simply retries until Kafka is up.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-create-topics
  labels:
    app.kubernetes.io/name: kafka-create-topics
    app.kubernetes.io/component: bootstrap
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-create-topics
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-topics
          image: apache/kafka:4.1.0
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for i in $(seq 1 60); do
                if /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BOOTSTRAP" --list >/dev/null 2>&1; then
                  break
                fi
                echo "waiting for $BOOTSTRAP ($i/60)"
                sleep 5
              done
              for topic in "$ARTICLES_TOPIC" "$USER_EVENTS_TOPIC"; do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BOOTSTRAP" \
                  --create --if-not-exists --topic "$topic" \
                  --partitions 3 --replication-factor 1
              done
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BOOTSTRAP" --list
          env:
            - name: BOOTSTRAP
              valueFrom:
                configMapKeyRef:
                  name: explained-endpoints
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: ARTICLES_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: explained-endpoints
                  key: KAFKA_ARTICLES_TOPIC
            - name: USER_EVENTS_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: explained-endpoints
                  key: KAFKA_USER_EVENTS_TOPIC
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi

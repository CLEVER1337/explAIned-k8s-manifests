# The only thing in the whole system that talks to the cluster.
#
# Nine application repositories build images and push them to Forgejo's registry. None of
# them holds a kubeconfig. What a release does instead is rewrite one line in
# overlays/homelab/images/<service>/kustomization.yaml and push that commit here — and this
# workflow turns the commit into cluster state.
#
# Three things follow from that, and they are the whole reason for the shape:
#   - one credential. KUBE_CONFIG exists in this repository's secrets and nowhere else.
#   - the git log is the deploy log. `git log overlays/homelab/images/` is every release.
#   - rollback is `git revert`. It runs the same path as a deploy, because it is one.
#
# It also applies on a manual edit to the manifests, which is correct: this repository is the
# desired state, not just a place tags land.

name: deploy

on:
  push:
    branches: [master]
    # A change to the dev overlay cannot affect the homelab, and rendering it needs
    # the committed dev credentials that this job has no reason to touch.
    paths-ignore:
      - 'overlays/dev/**'
      - 'README.md'
      - '**/README.md'
  # For re-applying after an out-of-band change, or after fixing something in the cluster
  # by hand and wanting the declared state back.
  workflow_dispatch:

# One deploy at a time. Two releases landing together would otherwise race on `kubectl
# apply`, and the loser would report success having applied the older tree.
concurrency:
  group: deploy-homelab
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      # The job image is `node`, which has neither. Both are pinned: kubectl to the
      # cluster's own minor version, because skew beyond ±1 is unsupported and the failure
      # is obscure. dl.k8s.io answers from this runner; several other release hosts do not.
      - name: Install kubectl and kustomize
        run: |
          set -eu
          curl -sSLo /usr/local/bin/kubectl https://dl.k8s.io/release/v1.36.3/bin/linux/amd64/kubectl
          chmod +x /usr/local/bin/kubectl
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin
          kubectl version --client
          kustomize version

      - name: Point at the cluster
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -eu
          test -n "$KUBE_CONFIG" || { echo "KUBE_CONFIG secret is empty"; exit 1; }
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 0600 "$HOME/.kube/config"
          # This account may not list namespaces, so `get nodes` is not the smoke test.
          # Something it is actually allowed to do is.
          kubectl -n apps get deployments >/dev/null
          echo "reached the cluster as $(kubectl config current-context)"

      # Renders before touching anything. A kustomize error here — a bad patch path, a
      # component that does not exist — should fail the job, not produce a partial apply.
      - name: Render
        run: |
          set -eu
          kustomize build overlays/homelab > /tmp/rendered.yaml
          wc -l /tmp/rendered.yaml
          grep -E '^\s+image: ' /tmp/rendered.yaml | sort -u

      # The two bootstrap Jobs are immutable once created, so an apply that changes their
      # spec fails with "field is immutable" and takes the whole deploy with it. They carry
      # ttlSecondsAfterFinished, so most of the time they are simply gone — this deletes
      # whatever is left over and lets the apply recreate them.
      - name: Clear the bootstrap jobs
        run: |
          kubectl -n apps delete job kafka-create-topics clickhouse-schema \
            --ignore-not-found --wait=true

      # What is healthy right now, before anything changes. This is the baseline the
      # rollout check below is judged against, and it is what keeps an incremental rollout
      # honest: on a cluster where six services have never had an image pushed, "not ready"
      # is the status quo, not something this deploy broke.
      - name: Snapshot what is already healthy
        run: |
          set -eu
          kubectl -n apps get deployments,statefulsets -l app.kubernetes.io/part-of=explained \
            -o jsonpath='{range .items[*]}{.kind}/{.metadata.name} {.status.readyReplicas} {.spec.replicas}{"\n"}{end}' \
            | awk '$2 != "" && $2 == $3 { print tolower($1) }' | sort > /tmp/healthy-before
          echo "healthy before this deploy:"; sed 's/^/  /' /tmp/healthy-before

      # `tee`, because the output is data: apply prints `configured` for what it changed and
      # `unchanged` for what it did not, and that is a far more reliable answer to "what did
      # this deploy touch" than diffing the commit.
      - name: Apply
        run: |
          set -eu
          kubectl -n apps apply -f /tmp/rendered.yaml | tee /tmp/apply.out
          grep -E '^(deployment|statefulset)\.apps/.*(configured|created)$' /tmp/apply.out \
            | sed 's|\.apps/|/|; s/ .*//' | sort > /tmp/changed
          echo "changed by this deploy:"; sed 's/^/  /' /tmp/changed

      # `apply` returns as soon as the API server has the objects. This turns a green tick
      # into a statement about running pods — but only about the pods this deploy is
      # answerable for.
      #
      # Two sets are waited on, and nothing else:
      #   changed         this deploy altered it, so it had better come up
      #   healthy-before  it was working, so it had better still be
      #
      # Everything outside that union is reported and ignored. That is the difference
      # between "the deploy failed" and "six services you have not released yet still have
      # no image", which the first version of this file could not tell apart — it waited on
      # everything, then rolled back the one service that had just been released.
      #
      # CronJobs are deliberately absent: a new ml-jobs tag does not "roll out", it takes
      # effect at the next scheduled run. That part of a deploy is invisible here.
      - name: Wait for the rollouts
        run: |
          set -eu

          # A third set, subtracted from the other two: workloads still carrying the
          # placeholder tag from overlays/homelab/images/<svc>/kustomization.yaml. `:main` is
          # what a component says before that service has ever been released, so those pods
          # are pulling an image nobody has pushed and no amount of waiting will help.
          #
          # "Changed" and "released" are not the same thing, which is what the previous
          # version of this step got wrong: editing a Deployment's strategy, or an earlier
          # botched `rollout undo` nudging its template, is enough to make apply report
          # `configured` for a service that has no image at all.
          kubectl -n apps get deployments -l app.kubernetes.io/part-of=explained \
            -o jsonpath='{range .items[*]}{.metadata.name} {.spec.template.spec.containers[0].image}{"\n"}{end}' \
            | awk '$2 ~ /:main$/ { print "deployment/" $1 }' | sort > /tmp/unreleased
          if [ -s /tmp/unreleased ]; then
            echo "never released, so not waited on:"; sed 's/^/  /' /tmp/unreleased
          fi

          sort -u /tmp/changed /tmp/healthy-before > /tmp/candidates
          comm -23 /tmp/candidates /tmp/unreleased > /tmp/must-be-ready

          failed=""
          while read -r obj; do
            [ -n "$obj" ] || continue
            echo "--- $obj"
            case "$obj" in
              statefulset/*) t=300s ;;
              *)             t=180s ;;
            esac
            kubectl -n apps rollout status "$obj" --timeout=$t || failed="$failed $obj"
          done < /tmp/must-be-ready

          # Informational: not this deploy's doing, and not a reason to fail it.
          kubectl -n apps get deployments,statefulsets -l app.kubernetes.io/part-of=explained \
            -o jsonpath='{range .items[*]}{.kind}/{.metadata.name} {.status.readyReplicas} {.spec.replicas}{"\n"}{end}' \
            | awk '$2 == "" || $2 != $3 { print tolower($1) }' | sort > /tmp/unready-after
          comm -23 /tmp/unready-after /tmp/must-be-ready > /tmp/ignored || true
          if [ -s /tmp/ignored ]; then
            echo "::notice::not ready, and not this deploy's to fix — never released, or already broken:"
            sed 's/^/  /' /tmp/ignored
          fi

          # Anything that was healthy before and is not now is a regression this deploy
          # caused; the rollback step needs to know which.
          if [ -n "$failed" ]; then
            for obj in $failed; do
              grep -qx "$obj" /tmp/healthy-before && echo "$obj" >> /tmp/regressed || true
            done
            echo "did not become ready:$failed"
            exit 1
          fi

      # Only true regressions — something that was serving before this deploy and is not now.
      # A newly released service that fails to start is deliberately left alone: undoing it
      # would put back an image that was already broken, and the useful action is to look at
      # the pod, then revert the commit.
      #
      # `rollout undo` on a StatefulSet holding a volume is not a thing to do unattended, so
      # Deployments only.
      - name: Roll back regressions
        if: failure()
        run: |
          test -s /tmp/regressed || { echo "nothing regressed — leaving the cluster as it is"; exit 0; }
          while read -r obj; do
            case "$obj" in
              deployment/*) echo "rolling back $obj"; kubectl -n apps rollout undo "$obj" || true ;;
              *)            echo "not rolling back $obj automatically" ;;
            esac
          done < /tmp/regressed
          echo "::warning::rolled back — the cluster no longer matches master, revert the commit"

      # Through Caddy, on the real hostname, exactly as a user would reach it. Catches the
      # case every probe in this repository misses: a green rollout in front of an
      # application that cannot answer, because the probes hit /metrics and prove only that
      # Kestrel is listening.
      #
      # Skipped while the service behind the path has never been released. Asserting that
      # /articles/search answers 200 is only meaningful once article-service has an image —
      # until then the gateway correctly returns 502 and failing on it would say nothing
      # about this deploy.
      - name: Smoke test
        run: |
          set -eu
          ready=$(kubectl -n apps get deployment article-service \
            -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "")
          if [ "${ready:-0}" = "0" ] || [ -z "${ready:-}" ]; then
            echo "::notice::article-service is not serving yet — skipping the smoke test"
            exit 0
          fi

          for i in $(seq 1 10); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' \
              'https://explained.homelab.lan/articles/search?query=k8s' || true)
            echo "attempt $i: $code"
            case "$code" in 200|204) exit 0 ;; esac
            sleep 6
          done
          echo "::error::the API never answered 2xx through the ingress"
          exit 1
